version: '3.4'

services:
  postgres:
    image: postgres:latest
    environment:
      POSTGRES_DB: cerms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=cerms;Username=postgres;Password=postgres
      - Jwt__Secret=a_very_long_and_secure_secret_key_1234567890
      - Jwt__Issuer=CERMS
      - Jwt__Audience=CERMS_Users
    ports:
      - "5000:5000"
    depends_on:
      - postgres

volumes:
  postgres_data:
